<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RUO Systems</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: white;
    overflow-x: hidden;

    background: radial-gradient(circle at top, #1a0b2e 0%, #070a12 60%, #05060a 100%);
}

/* glow */
body::before {
    content: "";
    position: fixed;
    top: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    background: rgba(168, 85, 247, 0.25);
    filter: blur(120px);
    z-index: -1;
}

body::after {
    content: "";
    position: fixed;
    bottom: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: rgba(59, 130, 246, 0.18);
    filter: blur(120px);
    z-index: -1;
}

/* HEADER */
.header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 24px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 2px;
}

.circle {
    width: 42px;
    height: 42px;
    background: white;
    border-radius: 50%;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 20px;
}

.hero h1 {
    font-size: clamp(30px, 4vw, 56px);
    font-weight: 700;
    max-width: 900px;
}

.hero p {
    margin-top: 12px;
    max-width: 600px;
    color: #c4b5fd;
}

.btn {
    margin-top: 25px;
    padding: 14px 28px;
    background: white;
    color: #0f172a;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
}

/* WIZARD */
.container {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
}

/* CARD */
.card {
    width: 100%;
    max-width: 760px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 34px;
    backdrop-filter: blur(18px);
}

/* =========================
   FIXED TIMELINE (NO LINE THROUGH CIRCLES)
========================= */

.steps {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    position: relative;
}

/* connecting line ONLY between circles */
.steps::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 44px;
    right: 44px;
    height: 3px;
    background: rgba(255,255,255,0.15);
    transform: translateY(-50%);
    z-index: 0;
}

/* BIGGER CIRCLES (2x feel) */
.step {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #cbd5e1;
    z-index: 1;
    transition: 0.3s;
}

/* active */
.step.active {
    background: #a855f7;
    color: white;
    box-shadow: 0 0 0 8px rgba(168,85,247,0.18);
}

/* done */
.step.done {
    background: #22c55e;
    color: white;
}

/* QUESTION */
.question {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 18px;
}

/* INPUTS */
input, select, textarea {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.25);
    color: white;
    font-size: 15px;
    outline: none;
}

/* dropdown arrow hint */
select {
    cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, white 50%),
                      linear-gradient(135deg, white 50%, transparent 50%);
    background-position: calc(100% - 20px) calc(1em + 2px),
                         calc(100% - 15px) calc(1em + 2px);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
}

/* NAV */
.nav {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
}

.back {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: #ddd;
    cursor: pointer;
    font-weight: 600;
}

.next {
    padding: 10px 18px;
    border-radius: 10px;
    background: #a855f7;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 700;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">RUO SYSTEMS</div>
    <div class="circle"></div>
</div>

<!-- HERO -->
<div class="hero" id="hero">
    <h1>Control Your Business Sales, Stock & Staff in One System</h1>
    <p>Modern POS built for structure, clarity, and growth.</p>
    <button class="btn" onclick="start()">Check Eligibility</button>
</div>

<!-- WIZARD -->
<div class="container" id="wizard">
    <div class="card">

        <div class="steps" id="steps"></div>

        <div class="question" id="question"></div>
        <div id="inputArea"></div>

        <div class="nav">
            <button class="back" onclick="backStep()">Back</button>
            <button class="next" onclick="nextStep()">Next</button>
        </div>

    </div>
</div>

<script>
let step = 0;

let data = {
    businessName: "",
    ownerName: "",
    phone: "",
    businessType: "",
    system: "",
    pain: ""
};

const questions = [
    { q: "Business Name", type: "input", key: "businessName" },
    { q: "Owner Name", type: "input", key: "ownerName" },
    { q: "Phone Number", type: "input", key: "phone" },
    { 
        q: "Business Type", 
        type: "select", 
        key: "businessType",
        options: ["Mini Mart", "Pharmacy", "Wines & Spirits", "Hardware", "Beauty Shop"]
    },
    { 
        q: "Biggest Challenge", 
        type: "select", 
        key: "pain",
        options: [
            "Stock losses / theft",
            "No sales tracking",
            "Manual bookkeeping",
            "No idea on profit",
            "Staff issues",
            "Everything is disorganized",
            "All of the above"
        ]
    },
    { 
        q: "Current System", 
        type: "select", 
        key: "system",
        options: ["Manual Book", "Excel", "Existing POS", "No System"]
    }
];

/* START */
function start() {
    document.getElementById("hero").style.display = "none";
    document.getElementById("wizard").style.display = "flex";
    buildSteps();
    loadStep();
}

/* BUILD STEPS */
function buildSteps() {
    let html = "";
    questions.forEach((_, i) => {
        html += `<div class="step" id="step-${i}">${i+1}</div>`;
    });
    document.getElementById("steps").innerHTML = html;
}

/* LOAD STEP */
function loadStep() {
    let q = questions[step];
    document.getElementById("question").innerText = q.q;

    let html = "";

    if(q.type === "input") {
        html = `<input id="field" value="${data[q.key]}" />`;
    }

    if(q.type === "select") {
        html = `<select id="field">
            <option disabled selected>Select an option</option>
            ${q.options.map(o => `<option ${data[q.key]===o?"selected":""}>${o}</option>`).join("")}
        </select>`;
    }

    document.getElementById("inputArea").innerHTML = html;

    updateSteps();
    setTimeout(() => document.getElementById("field").focus(), 100);
}

/* VALIDATION (IMPORTANT) */
function isValid() {
    let value = document.getElementById("field").value;
    return value && value.trim() !== "" && value !== "Select an option";
}

/* SAVE */
function save() {
    data[questions[step].key] = document.getElementById("field").value;
}

/* NEXT (BLOCK IF EMPTY) */
function nextStep() {
    if(!isValid()) {
        alert("Please complete this step before continuing.");
        return;
    }

    save();

    if(step < questions.length - 1) {
        step++;
        loadStep();
    } else {
        finish();
    }
}

/* BACK */
function backStep() {
    if(step > 0) {
        step--;
        loadStep();
    }
}

/* STEP UI */
function updateSteps() {
    questions.forEach((_, i) => {
        let el = document.getElementById(`step-${i}`);
        el.classList.remove("active","done");

        if(i < step) el.classList.add("done");
        if(i === step) el.classList.add("active");
    });
}

/* FINISH */
function finish() {

    save();

    const formData = new FormData();

    formData.append("businessName", data.businessName);
    formData.append("ownerName", data.ownerName);
    formData.append("phone", data.phone);
    formData.append("businessType", data.businessType);
    formData.append("pain", data.pain);
    formData.append("system", data.system);

    fetch("https://script.google.com/macros/s/AKfycbyrZCxxhe6ZtIMz056rL5uhhu8FcQKXsLGgHM8i2OFtYNK1O7XSXiq2zq1vHVh2IQQKHg/exec", {
        method: "POST",
        body: formData
    });

    alert("Thanks! We will contact you shortly.");
}
</script>

</body>
</html>
