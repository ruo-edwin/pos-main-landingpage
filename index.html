<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RUO Systems</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        color: #fff;
        overflow-x: hidden;

        /* brighter premium background */
        background: radial-gradient(circle at top, #2b1b4d 0%, #0b1020 55%, #070a12 100%);
    }

    /* soft glow */
    body::before {
        content: "";
        position: fixed;
        top: -150px;
        left: -150px;
        width: 500px;
        height: 500px;
        background: rgba(168, 85, 247, 0.25);
        filter: blur(120px);
        z-index: -1;
    }

    body::after {
        content: "";
        position: fixed;
        bottom: -150px;
        right: -150px;
        width: 500px;
        height: 500px;
        background: rgba(59, 130, 246, 0.18);
        filter: blur(120px);
        z-index: -1;
    }

    /* HEADER */
    .header {
        position: fixed;
        top: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 18px 5%;
        z-index: 10;
    }

    .logo {
        font-weight: bold;
        letter-spacing: 2px;
        font-size: 14px;
    }

    .circle {
        width: 35px;
        height: 35px;
        background: white;
        border-radius: 50%;
    }

    /* HERO */
    .hero {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 20px;
    }

    .hero h1 {
        font-size: clamp(28px, 4vw, 54px);
        max-width: 900px;
        line-height: 1.2;
    }

    .hero p {
        color: #cfcfcf;
        margin-top: 15px;
        max-width: 600px;
    }

    .btn {
        margin-top: 25px;
        padding: 14px 26px;
        background: white;
        color: black;
        border: none;
        border-radius: 10px;
        font-weight: bold;
        cursor: pointer;
    }

    /* WIZARD PAGE */
    .container {
        display: none;
        height: 100vh;
        width: 100%;
        justify-content: center;
        align-items: center;
        padding: 80px 20px;
    }

    /* CARD (IMPORTANT CHANGE) */
    .card {
        width: 100%;
        max-width: 520px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 18px;
        padding: 30px;
        backdrop-filter: blur(16px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    /* STEP INDICATOR (1,2,3,Finish) */
    .steps {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #aaa;
        margin-bottom: 15px;
    }

    .active-step {
        color: white;
        font-weight: bold;
    }

    /* PROGRESS BAR */
    .bar {
        height: 6px;
        background: rgba(255,255,255,0.08);
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 25px;
    }

    .fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #a855f7, #6366f1);
        transition: 0.3s;
    }

    .question {
        font-size: 20px;
        margin-bottom: 15px;
    }

    input, select, textarea {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(0,0,0,0.25);
        color: white;
        outline: none;
        font-size: 15px;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #a855f7;
        box-shadow: 0 0 10px rgba(168,85,247,0.25);
    }

    .nav {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .back {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: #ccc;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
    }

    .next {
        background: linear-gradient(135deg, #a855f7, #6366f1);
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
    }

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">RUO SYSTEMS</div>
    <div class="circle"></div>
</div>

<!-- HERO -->
<div class="hero" id="hero">
    <h1>Control Your Business Sales, Stock & Staff in One System</h1>
    <p>Find out if your business qualifies for a free POS demo in under 60 seconds.</p>
    <button class="btn" onclick="start()">Check Eligibility</button>
</div>

<!-- WIZARD -->
<div class="container" id="wizard">
    <div class="card">

        <div class="steps">
            <span id="s1">1</span>
            <span id="s2">2</span>
            <span id="s3">3</span>
            <span id="s4">Finish</span>
        </div>

        <div class="bar"><div class="fill" id="fill"></div></div>

        <div class="question" id="question"></div>
        <div id="inputArea"></div>

        <div class="nav">
            <button class="back" onclick="backStep()">Back</button>
            <button class="next" onclick="nextStep()">Next</button>
        </div>

    </div>
</div>

<script>
let step = 0;

let data = {
    businessName: "",
    ownerName: "",
    phone: "",
    businessType: "",
    system: "",
    pain: ""
};

const questions = [
    { q: "Business Name", type: "input", key: "businessName" },
    { q: "Owner Name", type: "input", key: "ownerName" },
    { q: "Phone Number", type: "input", key: "phone" },
    { q: "Business Type", type: "select", key: "businessType",
      options: ["Mini Mart", "Pharmacy", "Wines & Spirits", "Hardware", "Beauty Shop"] },
    { q: "Current System", type: "select", key: "system",
      options: ["Manual Book", "Excel", "Existing POS", "No System"] },
    { q: "Biggest Pain Point", type: "textarea", key: "pain" }
];

function start() {
    document.getElementById("hero").style.display = "none";
    document.getElementById("wizard").style.display = "flex";
    loadStep();
}

function loadStep() {
    let q = questions[step];
    document.getElementById("question").innerText = q.q;

    let html = "";

    if(q.type === "input") {
        html = `<input id="field" value="${data[q.key]}"/>`;
    }

    if(q.type === "select") {
        html = `<select id="field">
            ${q.options.map(o => `<option ${data[q.key]===o?"selected":""}>${o}</option>`).join("")}
        </select>`;
    }

    if(q.type === "textarea") {
        html = `<textarea id="field">${data[q.key]}</textarea>`;
    }

    document.getElementById("inputArea").innerHTML = html;
    updateProgress();
    updateSteps();

    setTimeout(() => {
        document.getElementById("field").focus();
    }, 100);
}

function save() {
    data[questions[step].key] = document.getElementById("field").value;
}

function nextStep() {
    save();
    if(step < questions.length - 1) {
        step++;
        loadStep();
    } else {
        submit();
    }
}

function backStep() {
    if(step > 0) {
        step--;
        loadStep();
    }
}

function updateProgress() {
    document.getElementById("fill").style.width =
        (step / (questions.length - 1)) * 100 + "%";
}

function updateSteps() {
    document.querySelectorAll(".steps span").forEach((el, i) => {
        el.classList.remove("active-step");
        if(i === step) el.classList.add("active-step");
    });
}

function submit() {
    console.log(data);
    alert("Thanks! We will contact you shortly.");
}
</script>

</body>
</html>
