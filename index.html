<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RUO Systems</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: #0f172a;
    overflow-x: hidden;

    /* ✅ BRIGHT SAAS BACKGROUND */
    background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 40%, #f1f5f9 100%);
}

/* soft modern glow (light SaaS style) */
body::before {
    content: "";
    position: fixed;
    top: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    background: rgba(99, 102, 241, 0.18);
    filter: blur(120px);
    z-index: -1;
}

body::after {
    content: "";
    position: fixed;
    bottom: -200px;
    right: -200px;
    width: 600px;
    height: 600px;
    background: rgba(168, 85, 247, 0.14);
    filter: blur(120px);
    z-index: -1;
}

/* HEADER */
.header {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 18px 6%;
    display: flex;
    justify-content: space-between;
    z-index: 10;
}

.logo {
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 14px;
    color: #0f172a;
}

/* HERO */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0 20px;
}

.hero h1 {
    font-size: clamp(30px, 4vw, 56px);
    font-weight: 700;
    max-width: 900px;
    color: #0f172a;
}

.hero p {
    margin-top: 12px;
    max-width: 600px;
    color: #475569;
    font-weight: 400;
}

.btn {
    margin-top: 25px;
    padding: 14px 28px;
    background: #4f46e5;
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(79,70,229,0.25);
}

/* WIZARD */
.container {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
}

/* CARD */
.card {
    width: 100%;
    max-width: 720px;
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(15,23,42,0.08);
}

/* TIMELINE STEPPER */
.steps {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
    position: relative;
}

/* line behind steps */
.steps::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background: #e2e8f0;
    z-index: 0;
}

/* step circle */
.step {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    color: #64748b;
    z-index: 1;
    transition: 0.3s;
}

/* active step */
.step.active {
    background: #4f46e5;
    color: white;
    box-shadow: 0 0 0 6px rgba(79,70,229,0.15);
}

/* completed step */
.step.done {
    background: #22c55e;
    color: white;
}

/* QUESTION */
.question {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 15px;
    color: #0f172a;
}

/* INPUTS */
input, select, textarea {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    font-size: 15px;
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 4px rgba(79,70,229,0.1);
}

/* NAV */
.nav {
    display: flex;
    justify-content: space-between;
    margin-top: 25px;
}

.back {
    padding: 10px 18px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    background: white;
    cursor: pointer;
    font-weight: 500;
    color: #334155;
}

.next {
    padding: 10px 18px;
    border-radius: 10px;
    background: #4f46e5;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: 600;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">RUO SYSTEMS</div>
</div>

<!-- HERO -->
<div class="hero" id="hero">
    <h1>Run Your Entire Business From One Smart System</h1>
    <p>Sales, stock, staff & reports — simplified in one dashboard.</p>
    <button class="btn" onclick="start()">Check Eligibility</button>
</div>

<!-- WIZARD -->
<div class="container" id="wizard">
    <div class="card">

        <div class="steps" id="steps"></div>

        <div class="question" id="question"></div>
        <div id="inputArea"></div>

        <div class="nav">
            <button class="back" onclick="backStep()">Back</button>
            <button class="next" onclick="nextStep()">Next</button>
        </div>

    </div>
</div>

<script>
let step = 0;

let data = {
    businessName: "",
    ownerName: "",
    phone: "",
    businessType: "",
    system: "",
    pain: ""
};

const questions = [
    { q: "Business Name", type: "input", key: "businessName" },
    { q: "Owner Name", type: "input", key: "ownerName" },
    { q: "Phone Number", type: "input", key: "phone" },
    { q: "Business Type", type: "select", key: "businessType",
      options: ["Mini Mart", "Pharmacy", "Wines & Spirits", "Hardware", "Beauty Shop"] },
    { q: "Current System", type: "select", key: "system",
      options: ["Manual Book", "Excel", "Existing POS", "No System"] },
    { q: "Biggest Pain Point", type: "textarea", key: "pain" }
];

function start() {
    document.getElementById("hero").style.display = "none";
    document.getElementById("wizard").style.display = "flex";
    buildSteps();
    loadStep();
}

/* BUILD TIMELINE STEPS */
function buildSteps() {
    let html = "";

    questions.forEach((_, i) => {
        html += `<div class="step" id="step-${i}">${i+1}</div>`;
    });

    html += `<div class="step" id="step-${questions.length}">✓</div>`;

    document.getElementById("steps").innerHTML = html;
}

/* LOAD QUESTION */
function loadStep() {
    let q = questions[step];

    document.getElementById("question").innerText = q.q;

    let html = "";

    if(q.type === "input") {
        html = `<input id="field" value="${data[q.key]}"/>`;
    }

    if(q.type === "select") {
        html = `<select id="field">
            ${q.options.map(o => `<option ${data[q.key]===o?"selected":""}>${o}</option>`).join("")}
        </select>`;
    }

    if(q.type === "textarea") {
        html = `<textarea id="field">${data[q.key]}</textarea>`;
    }

    document.getElementById("inputArea").innerHTML = html;

    updateStepsUI();

    setTimeout(() => {
        document.getElementById("field").focus();
    }, 100);
}

/* SAVE */
function save() {
    data[questions[step].key] = document.getElementById("field").value;
}

/* NEXT */
function nextStep() {
    save();

    if(step < questions.length - 1) {
        step++;
        loadStep();
    } else {
        finish();
    }
}

/* BACK */
function backStep() {
    if(step > 0) {
        step--;
        loadStep();
    }
}

/* STEP UI LOGIC */
function updateStepsUI() {
    questions.forEach((_, i) => {
        let el = document.getElementById(`step-${i}`);
        if(!el) return;

        el.classList.remove("active","done");

        if(i < step) el.classList.add("done");
        if(i === step) el.classList.add("active");
    });

    let finish = document.getElementById(`step-${questions.length}`);
    finish.classList.remove("active","done");

    if(step === questions.length - 1) {
        finish.classList.add("active");
    }
}

/* FINISH */
function finish() {
    document.getElementById(`step-${questions.length}`).classList.add("done");
    console.log("FINAL DATA:", data);
    alert("Thanks! We’ll contact you shortly.");
}

</script>

</body>
</html>
