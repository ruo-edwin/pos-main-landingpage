<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RUO Systems</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: white;
        min-height: 100vh;
        overflow-x: hidden;
        background: radial-gradient(circle at top, #1a0b2e 0%, #000 60%);
    }

    /* glowing background blobs */
    body::before {
        content: "";
        position: fixed;
        top: -200px;
        left: -200px;
        width: 600px;
        height: 600px;
        background: rgba(128, 0, 255, 0.25);
        filter: blur(120px);
        z-index: -1;
    }

    body::after {
        content: "";
        position: fixed;
        bottom: -200px;
        right: -200px;
        width: 600px;
        height: 600px;
        background: rgba(0, 150, 255, 0.15);
        filter: blur(120px);
        z-index: -1;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 5%;
        position: fixed;
        top: 0;
        width: 100%;
        z-index: 10;
    }

    .logo {
        font-weight: bold;
        letter-spacing: 2px;
        font-size: 14px;
    }

    .circle {
        width: 35px;
        height: 35px;
        background: white;
        border-radius: 50%;
    }

    /* HERO FULL SCREEN */
    .hero {
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 20px;
        transition: all 0.3s ease;
    }

    .hero h1 {
        font-size: clamp(26px, 4vw, 52px);
        font-weight: bold;
        max-width: 900px;
        line-height: 1.2;
    }

    .hero p {
        color: #aaa;
        margin-top: 15px;
        font-size: clamp(14px, 1.5vw, 18px);
        max-width: 600px;
    }

    .btn {
        margin-top: 25px;
        padding: 14px 25px;
        background: white;
        color: black;
        border: none;
        cursor: pointer;
        font-weight: bold;
        border-radius: 10px;
    }

    /* WIZARD FULL SCREEN */
    .container {
        display: none;
        height: 100vh;
        width: 100%;
        padding: 120px 5% 40px;
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .wizard-box {
        width: 100%;
        max-width: 700px;
    }

    .progress {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #888;
        margin-bottom: 10px;
    }

    .bar {
        width: 100%;
        height: 6px;
        background: rgba(255,255,255,0.08);
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 30px;
    }

    .fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #a855f7, #6366f1);
        transition: 0.3s;
    }

    .question {
        font-size: clamp(18px, 2vw, 24px);
        margin-bottom: 15px;
        text-align: left;
    }

    input, select, textarea {
        width: 100%;
        padding: 14px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        color: white;
        border-radius: 10px;
        outline: none;
        font-size: 16px;
    }

    input:focus, select:focus, textarea:focus {
        border: 1px solid #a855f7;
        box-shadow: 0 0 10px rgba(168,85,247,0.3);
    }

    .nav {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
    }

    .nav button {
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        border-radius: 8px;
    }

    .next {
        background: linear-gradient(135deg, #a855f7, #6366f1);
        color: white;
    }

    .back {
        background: transparent;
        color: #aaa;
        border: 1px solid rgba(255,255,255,0.15);
    }

    /* MOBILE */
    @media (max-width: 600px) {
        .header {
            padding: 15px 20px;
        }

        .progress {
            font-size: 10px;
        }

        .wizard-box {
            padding: 0 10px;
        }
    }

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">RUO SYSTEMS</div>
    <div class="circle"></div>
</div>

<!-- HERO -->
<div class="hero" id="hero">
    <h1>Control Your Business Sales, Stock & Staff in One System</h1>
    <p>Find out if your business qualifies for a free POS demo in under 60 seconds.</p>
    <button class="btn" onclick="start()">Check Eligibility</button>
</div>

<!-- WIZARD -->
<div class="container" id="wizard">
    <div class="wizard-box">

        <div class="progress">
            <span>Business</span>
            <span>Owner</span>
            <span>Phone</span>
            <span>Type</span>
            <span>System</span>
            <span>Pain</span>
        </div>

        <div class="bar"><div class="fill" id="fill"></div></div>

        <div class="question" id="question"></div>
        <div id="inputArea"></div>

        <div class="nav">
            <button class="back" onclick="backStep()">Back</button>
            <button class="next" id="nextBtn" onclick="nextStep()">Next</button>
        </div>

    </div>
</div>

<script>
let step = 0;

let data = {
    businessName: "",
    ownerName: "",
    phone: "",
    businessType: "",
    system: "",
    pain: ""
};

const questions = [
    { q: "Business Name", type: "input", key: "businessName" },
    { q: "Owner Name", type: "input", key: "ownerName" },
    { q: "Phone Number", type: "input", key: "phone" },
    { q: "Business Type", type: "select", key: "businessType",
      options: ["Mini Mart", "Pharmacy", "Wines & Spirits", "Hardware", "Beauty Shop"] },
    { q: "Current System", type: "select", key: "system",
      options: ["Manual Book", "Excel", "Existing POS", "No System"] },
    { q: "Biggest Pain Point", type: "textarea", key: "pain" }
];

function start() {
    document.getElementById("hero").style.display = "none";
    document.getElementById("wizard").style.display = "flex";
    loadStep();
}

function loadStep() {
    let q = questions[step];

    document.getElementById("question").innerText = q.q;

    let html = "";

    if(q.type === "input") {
        html = `<input id="field" value="${data[q.key]}"/>`;
    }

    if(q.type === "select") {
        html = `<select id="field">
            ${q.options.map(o => `<option ${data[q.key]===o?"selected":""}>${o}</option>`).join("")}
        </select>`;
    }

    if(q.type === "textarea") {
        html = `<textarea id="field">${data[q.key]}</textarea>`;
    }

    document.getElementById("inputArea").innerHTML = html;
    updateProgress();

    setTimeout(() => {
        const field = document.getElementById("field");
        if(field) field.focus();
    }, 100);
}

function save() {
    let value = document.getElementById("field").value;
    data[questions[step].key] = value;
}

function nextStep() {
    save();
    if(step < questions.length - 1) {
        step++;
        loadStep();
    } else {
        submit();
    }
}

function backStep() {
    if(step > 0) {
        step--;
        loadStep();
    }
}

function updateProgress() {
    let percent = (step / (questions.length - 1)) * 100;
    document.getElementById("fill").style.width = percent + "%";
}

function submit() {
    console.log("FINAL LEAD:", data);
    alert("Thanks! We will contact you shortly.");
}
</script>

</body>
</html>
