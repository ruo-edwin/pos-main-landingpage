<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RUO Systems</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0a0a0a;
        color: white;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        padding: 20px 40px;
        align-items: center;
    }

    .logo {
        font-weight: bold;
        letter-spacing: 2px;
    }

    .circle {
        width: 35px;
        height: 35px;
        background: white;
        border-radius: 50%;
    }

    /* HERO */
    .hero {
        text-align: center;
        padding: 80px 20px;
        max-width: 800px;
        margin: auto;
    }

    .hero h1 {
        font-size: 42px;
        font-weight: bold;
    }

    .hero p {
        color: #aaa;
        margin-top: 15px;
    }

    .btn {
        margin-top: 25px;
        padding: 14px 25px;
        background: white;
        color: black;
        border: none;
        cursor: pointer;
        font-weight: bold;
        border-radius: 10px;
    }

    /* WIZARD */
    .container {
        max-width: 600px;
        margin: auto;
        padding: 20px;
        display: none;
    }

    .progress {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #888;
    }

    .bar {
        width: 100%;
        height: 6px;
        background: #222;
        margin: 10px 0 30px;
        border-radius: 5px;
        overflow: hidden;
    }

    .fill {
        height: 100%;
        width: 0%;
        background: white;
        transition: 0.3s;
    }

    .question {
        font-size: 22px;
        margin-bottom: 15px;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        background: #111;
        border: 1px solid #333;
        color: white;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .nav {
        display: flex;
        justify-content: space-between;
    }

    .nav button {
        padding: 10px 20px;
        border: none;
        cursor: pointer;
        border-radius: 8px;
    }

    .next {
        background: white;
        color: black;
    }

    .back {
        background: #222;
        color: white;
    }

    .submit {
        background: green;
        color: black;
        font-weight: bold;
    }

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="logo">RUO SYSTEMS</div>
    <div class="circle"></div>
</div>

<!-- HERO -->
<div class="hero" id="hero">
    <h1>Control Your Business Sales, Stock & Staff in One System</h1>
    <p>Find out if your business qualifies for a free POS demo in under 60 seconds.</p>
    <button class="btn" onclick="start()">Check Eligibility</button>
</div>

<!-- WIZARD -->
<div class="container" id="wizard">

    <div class="progress">
        <span>Business</span>
        <span>Owner</span>
        <span>Phone</span>
        <span>Type</span>
        <span>System</span>
        <span>Pain</span>
    </div>

    <div class="bar"><div class="fill" id="fill"></div></div>

    <div class="question" id="question"></div>
    <div id="inputArea"></div>

    <div class="nav">
        <button class="back" onclick="backStep()">Back</button>
        <button class="next" id="nextBtn" onclick="nextStep()">Next</button>
    </div>

</div>

<script>
let step = 0;

let data = {
    businessName: "",
    ownerName: "",
    phone: "",
    businessType: "",
    system: "",
    pain: ""
};

const questions = [
    { q: "Business Name", type: "input", key: "businessName" },
    { q: "Owner Name", type: "input", key: "ownerName" },
    { q: "Phone Number", type: "input", key: "phone" },
    { q: "Business Type", type: "select", key: "businessType",
      options: ["Mini Mart", "Pharmacy", "Wines & Spirits", "Hardware", "Beauty Shop"] },
    { q: "Current System", type: "select", key: "system",
      options: ["Manual Book", "Excel", "Existing POS", "No System"] },
    { q: "Biggest Pain Point", type: "textarea", key: "pain" }
];

function start() {
    document.getElementById("hero").style.display = "none";
    document.getElementById("wizard").style.display = "block";
    loadStep();
}

function loadStep() {
    let q = questions[step];

    document.getElementById("question").innerText = q.q;

    let html = "";

    if(q.type === "input") {
        html = `<input id="field" value="${data[q.key]}"/>`;
    }

    if(q.type === "select") {
        html = `<select id="field">
            ${q.options.map(o => `<option ${data[q.key]===o?"selected":""}>${o}</option>`).join("")}
        </select>`;
    }

    if(q.type === "textarea") {
        html = `<textarea id="field">${data[q.key]}</textarea>`;
    }

    document.getElementById("inputArea").innerHTML = html;

    updateProgress();
}

function save() {
    let value = document.getElementById("field").value;
    data[questions[step].key] = value;
}

function nextStep() {
    save();

    if(step < questions.length - 1) {
        step++;
        loadStep();
    } else {
        submit();
    }
}

function backStep() {
    if(step > 0) {
        step--;
        loadStep();
    }
}

function updateProgress() {
    let percent = (step / (questions.length - 1)) * 100;
    document.getElementById("fill").style.width = percent + "%";
}

function submit() {
    console.log("FINAL LEAD:", data);

    alert("Thanks! We will contact you shortly.");

    // HERE you later connect:
    // - Google Sheets API
    // - Backend (FastAPI / Node)
    // - WhatsApp redirect
}
</script>

</body>
</html>
